name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/routing:^${{ matrix.laravel }}.0" \
            "illuminate/auth:^${{ matrix.laravel }}.0"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          find src config routes database -type f \( -name '*.php' -o -name '*.php.stub' \) -print0 \
            | xargs -0 -n1 php -l

      - name: Check autoload
        run: composer dump-autoload --optimize --strict-psr

  # --- CD : calcule la prochaine version depuis les messages de commit et crée le tag ---
  version:
    name: Compute next version
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: next
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)

          if [ -n "$LAST" ] && [ "$(git rev-list -n1 "$LAST")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD est déjà taggé $LAST, rien à publier."
            exit 0
          fi

          if [ -n "$LAST" ]; then RANGE="$LAST..HEAD"; else RANGE="HEAD"; LAST="v0.0.0"; fi
          LOG=$(git log "$RANGE" --format='%s%n%b')

          if   echo "$LOG" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then BUMP=major
          elif echo "$LOG" | grep -qE '^feat(\(.+\))?:';                     then BUMP=minor
          elif echo "$LOG" | grep -qE '^(fix|perf|refactor)(\(.+\))?:';      then BUMP=patch
          else
            echo "Aucun commit feat/fix/perf/refactor depuis $LAST, pas de nouvelle version."
            exit 0
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          TAG="v$MAJOR.$MINOR.$PATCH"

          echo "$LAST -> $TAG ($BUMP)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
