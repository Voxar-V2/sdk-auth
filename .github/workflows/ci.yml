name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/routing:^${{ matrix.laravel }}.0" \
            "illuminate/auth:^${{ matrix.laravel }}.0"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          find src config routes database -type f \( -name '*.php' -o -name '*.php.stub' \) -print0 \
            | xargs -0 -n1 php -l

      - name: Check autoload
        run: composer dump-autoload --optimize --strict-psr
