name: Release

on:
  # Tag poussé à la main : git tag v1.2.3 && git push origin v1.2.3
  push:
    tags: ['v*']
  # Appelé automatiquement par la CI (CD) après un push sur main
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint PHP files
        run: |
          find src config routes database -type f \( -name '*.php' -o -name '*.php.stub' \) -print0 \
            | xargs -0 -n1 php -l

      - name: Build package archive
        run: |
          VERSION="${TAG#v}"
          composer archive --format=zip --dir=dist --file="voxar-auth-sdk-${VERSION}"
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
